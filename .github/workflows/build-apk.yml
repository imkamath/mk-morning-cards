name: Build Android app

on:
  push:
    paths:
      - 'android/**'
      - 'index.html'
      - 'mk-morning-cards-android.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack the app project
        run: |
          if [ -f mk-morning-cards-android.zip ]; then unzip -o mk-morning-cards-android.zip; fi
          test -f android/settings.gradle
          python3 android/tools/prepare.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build the app
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publish the app for download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk MK-Morning-Cards.apk
          gh release delete android-app --yes --cleanup-tag || true
          gh release create android-app MK-Morning-Cards.apk \
            --target "${{ github.sha }}" \
            --title "MK Morning Cards for Android" \
            --notes "On your Android phone, tap MK-Morning-Cards.apk below to download it, then open it to install."
