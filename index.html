<meta name="description" content="Daily Good Morning cards with the MK signature, ready to share on WhatsApp.">

<style>
/* Layout: one centred column — the card is the hero, controls sit under it like a darkroom tray. Single dawn-dark look by choice. */
:root{
  --ink:#171426;        /* page ground: pre-dawn indigo */
  --panel:#221d36;      /* raised surfaces */
  --line:#3a3354;       /* hairlines */
  --text:#f3ecdf;       /* warm paper white */
  --muted:#b3a9c4;      /* secondary text */
  --gold:#e3bd78;       /* signature gold accent */
  --gold-deep:#b98a3e;
  --festive:#f08a5d;    /* festival chip */
  --f-display:"Playfair Display",Georgia,"Times New Roman",serif;
  --f-quote:"Cormorant Garamond",Georgia,serif;
  --f-ui:"Karla",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
body{background:var(--ink);color:var(--text);font-family:var(--f-ui);font-size:15px;line-height:1.5}
.wrap{max-width:600px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-size:1.55rem;margin:0;letter-spacing:.01em;color:var(--gold);text-wrap:balance}
.when{font-size:.82rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.status{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:.95rem}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--line);color:var(--muted)}
.chip.fest{border-color:var(--festive);color:var(--festive)}
.card{position:relative;width:100%;max-width:100%;aspect-ratio:1/1;border-radius:6px;overflow:hidden;background:var(--panel);box-shadow:0 18px 50px rgba(0,0,0,.45)}
.card img{display:block;width:100%;height:100%;object-fit:cover}
.card .loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:.9rem}
.daynav{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px}
.daynav .mid{text-align:center;font-family:var(--f-quote);font-size:1.25rem;font-weight:600;min-width:0}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:10px 14px;min-height:44px}
button:hover{border-color:var(--gold-deep)}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button.primary{display:flex;align-items:center;justify-content:center;gap:10px;background:linear-gradient(180deg,var(--gold),var(--gold-deep));color:#1d1406;border:none;font-weight:700;font-size:1.02rem;width:100%}
#dlBtn{width:100%}
button.primary:disabled{opacity:.6;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row button{flex:1 1 0;min-width:120px}
.icon{width:44px;padding:0;font-size:1.2rem}
.note{font-size:.85rem;color:var(--muted);margin:0}
.note b{color:var(--text)}
.toast{font-size:.9rem;color:var(--gold);min-height:1.4em;margin:0}
.editor{display:flex;flex-direction:column;gap:8px}
textarea{font-family:var(--f-quote);font-size:1.15rem;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px;min-height:90px;resize:vertical}
section h2{font-family:var(--f-display);font-size:1.1rem;margin:0 0 8px;color:var(--text)}
.fests{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.fests li{border-top:1px solid var(--line)}
.fests button{width:100%;display:grid;grid-template-columns:92px 1fr auto;gap:10px;align-items:center;text-align:left;background:none;border:none;border-radius:0;padding:10px 2px}
.fests .d{font-variant-numeric:tabular-nums;color:var(--gold);font-weight:600;font-size:.9rem}
.fests .n{min-width:0}
.fests .a{color:var(--muted);font-size:.8rem}
[hidden]{display:none!important}
@media (prefers-reduced-motion:no-preference){.card img{transition:opacity .35s ease}}
</style>
</head><body><div class="wrap">
  <header>
    <h1>MK Morning Cards</h1>
    <span class="when" id="when">New card every day at 12:00 AM</span>
  </header>

  <div class="status" id="status"></div>

  <div class="card">
    <img id="cardImg" alt="Today's Good Morning card">
    <div class="loading" id="loading">Painting today's sunrise…</div>
  </div>

  <div class="daynav">
    <button class="icon" id="prevDay" aria-label="Previous day">‹</button>
    <div class="mid" id="dayLabel"></div>
    <button class="icon" id="nextDay" aria-label="Next day">›</button>
  </div>

  <button class="primary" id="saveBtn"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.4.8 3.2.7a2.8 2.8 0 0 0 1.8-1.3 2.3 2.3 0 0 0 .2-1.3c0-.1-.2-.2-.5-.3Z"/></svg><span>Share to WhatsApp</span></button>
  <button id="dlBtn">Download card</button>
  <p class="toast" id="toast" role="status"></p>

  <div class="row">
    <button id="newQuote">Another quote</button>
    <button id="newScene">Another background</button>
    <button id="editQuote">Edit quote</button>
  </div>
  <div class="row" id="todayRow" hidden><button id="goToday">Back to today</button></div>

  <div class="editor" id="editor" hidden>
    <textarea id="quoteText" aria-label="Quote text"></textarea>
    <div class="row"><button id="applyQuote">Use this quote</button><button id="resetQuote">Reset</button></div>
  </div>

  <p class="note" id="howto">Tap <b>Share to WhatsApp</b>, choose <b>WhatsApp</b> in the share menu, then pick a chat or <b>My status</b>. Tip: use your browser's <b>Add to Home screen</b> to keep this as an app.</p>

  <section>
    <h2>Coming up</h2>
    <ul class="fests" id="fests"></ul>
  </section>
</div>

/* ---------- painting engine: every background is drawn on a 1080×1080 canvas ---------- */
const W = 1080, H = 1080;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
const lerp=(a,b,t)=>a+(b-a)*t;
function hex(c){c=c.replace('#','');return[parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)]}
function mix(c1,c2,t){const a=hex(c1),b=hex(c2);return'#'+a.map((v,i)=>Math.round(lerp(v,b[i],t)).toString(16).padStart(2,'0')).join('')}
function rgba(c,a){const[r,g,b]=hex(c);return`rgba(${r},${g},${b},${a})`}

function vgrad(ctx,y0,y1,stops){const g=ctx.createLinearGradient(0,y0,0,y1);stops.forEach(([o,c])=>g.addColorStop(o,c));return g}
function sky(ctx,stops,y1=H){ctx.fillStyle=vgrad(ctx,0,y1,stops);ctx.fillRect(0,0,W,y1)}
function glow(ctx,x,y,r,color,a=1){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,rgba(color,a));g.addColorStop(1,rgba(color,0));ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}
function sun(ctx,x,y,r,{core='#fffbe8',halo='#ffcf7a',rays=true,rng=Math.random}={}){
  ctx.save();ctx.globalCompositeOperation='lighter';
  glow(ctx,x,y,r*14,halo,.35);glow(ctx,x,y,r*5,halo,.55);
  if(rays){for(let i=0;i<22;i++){const a=(i/22)*Math.PI*2+rng()*.1,l=r*(3+rng()*4);
    const g=ctx.createLinearGradient(x,y,x+Math.cos(a)*l,y+Math.sin(a)*l);g.addColorStop(0,rgba(halo,.55));g.addColorStop(1,rgba(halo,0));
    ctx.strokeStyle=g;ctx.lineWidth=2+rng()*3;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l);ctx.stroke()}}
  ctx.restore();glow(ctx,x,y,r*1.6,core,.9);ctx.fillStyle=core;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}
function moon(ctx,x,y,r,{crescent=false,color='#fff6dc',bg='#0b1330'}={}){
  glow(ctx,x,y,r*5,color,.25);ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
  if(crescent){ctx.fillStyle=bg;ctx.beginPath();ctx.arc(x+r*.42,y-r*.18,r*.9,0,Math.PI*2);ctx.fill()}}
function stars(ctx,rng,n,y1,col='#ffffff'){for(let i=0;i<n;i++){const x=rng()*W,y=rng()*y1,s=rng()*1.8+.3;ctx.fillStyle=rgba(col,.35+rng()*.6);ctx.beginPath();ctx.arc(x,y,s,0,Math.PI*2);ctx.fill()}}
function birds(ctx,rng,n,x0,y0,spread,col='#2a2230'){ctx.strokeStyle=col;ctx.lineCap='round';for(let i=0;i<n;i++){const x=x0+(rng()-.5)*spread,y=y0+(rng()-.5)*spread*.35,s=6+rng()*9;ctx.lineWidth=1.6+s*.12;ctx.beginPath();ctx.moveTo(x-s,y-s*.35);ctx.quadraticCurveTo(x-s*.4,y-s*.5,x,y);ctx.quadraticCurveTo(x+s*.4,y-s*.5,x+s,y-s*.35);ctx.stroke()}}
/* midpoint-displacement ridge */
function ridge(rng,y0,amp,rough=.55,levels=8){let pts=[y0+(rng()-.5)*amp,y0+(rng()-.5)*amp];let sc=amp;
  for(let l=0;l<levels;l++){const n=[];for(let i=0;i<pts.length-1;i++){n.push(pts[i]);n.push((pts[i]+pts[i+1])/2+(rng()-.5)*sc)}n.push(pts[pts.length-1]);pts=n;sc*=rough}
  return pts.map((y,i)=>[-20+i*(W+40)/(pts.length-1),y])}
function peakRidge(rng,base,peaks,amp){/* ridge with explicit peaks */const p=ridge(rng,base,amp*.35,.52,8);
  return p.map(([x,y])=>{let d=0;peaks.forEach(([px,ph,pw])=>{d+=ph*Math.exp(-((x-px)**2)/(2*pw*pw))});return[x,y-d]})}
function fillRidge(ctx,pts,fill,bottom=H){ctx.fillStyle=fill;ctx.beginPath();ctx.moveTo(pts[0][0],bottom);pts.forEach(([x,y])=>ctx.lineTo(x,y));ctx.lineTo(pts[pts.length-1][0],bottom);ctx.closePath();ctx.fill()}
function snowCap(ctx,pts,depth,col,rng){ctx.save();ctx.beginPath();ctx.moveTo(pts[0][0],H);pts.forEach(([x,y])=>ctx.lineTo(x,y));ctx.lineTo(pts[pts.length-1][0],H);ctx.closePath();ctx.clip();
  const minY=Math.min(...pts.map(p=>p[1]));ctx.fillStyle=col;ctx.beginPath();pts.forEach(([x,y],i)=>{i?ctx.lineTo(x,y-4):ctx.moveTo(x,y-4)});
  for(let i=pts.length-1;i>=0;i--){const[x,y]=pts[i];const sn=Math.max(0,(depth-(y-minY)*0.9));ctx.lineTo(x,y+sn*(0.6+rng()*0.8))}ctx.closePath();ctx.fill();ctx.restore()}
function smoothHill(ctx,rng,base,amp,fill,freq=1){const ph=[rng()*9,rng()*9,rng()*9];ctx.fillStyle=fill;ctx.beginPath();ctx.moveTo(0,H);
  for(let x=0;x<=W;x+=12){const y=base+Math.sin(x/W*Math.PI*1.3*freq+ph[0])*amp+Math.sin(x/W*Math.PI*3.1*freq+ph[1])*amp*.35+Math.sin(x/W*Math.PI*7*freq+ph[2])*amp*.08;ctx.lineTo(x,y)}ctx.lineTo(W,H);ctx.closePath();ctx.fill();
  return x=>base+Math.sin(x/W*Math.PI*1.3*freq+ph[0])*amp+Math.sin(x/W*Math.PI*3.1*freq+ph[1])*amp*.35+Math.sin(x/W*Math.PI*7*freq+ph[2])*amp*.08}
function cloudSea(ctx,rng,top,tint,shade){for(let layer=0;layer<5;layer++){const y0=top+layer*((H-top)/5);const n=26+layer*6;
  for(let i=0;i<n;i++){const x=rng()*(W+200)-100,y=y0+rng()*((H-top)/4),rx=60+layer*38+rng()*80,ry=rx*.38;
    const g=ctx.createRadialGradient(x,y-ry*.3,0,x,y,rx);g.addColorStop(0,rgba(tint,.55));g.addColorStop(.6,rgba(mix(tint,shade,.5),.35));g.addColorStop(1,rgba(shade,0));
    ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}}}
function cloudsSky(ctx,rng,n,y0,y1,col,a=.35){for(let i=0;i<n;i++){const x=rng()*W,y=lerp(y0,y1,rng()),rx=120+rng()*260,ry=8+rng()*18;
  const g=ctx.createRadialGradient(x,y,0,x,y,rx);g.addColorStop(0,rgba(col,a));g.addColorStop(1,rgba(col,0));ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}}
function waterShimmer(ctx,rng,x,y0,y1,col,width=160){ctx.save();ctx.globalCompositeOperation='lighter';for(let y=y0;y<y1;y+=4+rng()*5){const t=(y-y0)/(y1-y0),w=width*(0.3+t*1.4)*(0.4+rng());
  ctx.fillStyle=rgba(col,(1-t)*.55+.08);ctx.fillRect(x-w/2+(rng()-.5)*w*.4,y,w,1.5+t*2.5)}ctx.restore()}
function pine(ctx,x,y,h,col,snow){const w=h*.36;ctx.fillStyle=col;ctx.beginPath();const tiers=5;
  for(let i=0;i<tiers;i++){const ty=y-h+(i*h/tiers)*.95,bw=w*(0.35+i/tiers*.75);ctx.moveTo(x,ty);ctx.lineTo(x+bw,ty+h/tiers*1.4);ctx.lineTo(x-bw,ty+h/tiers*1.4);ctx.closePath()}
  ctx.fill();ctx.fillRect(x-h*.03,y-h*.06,h*.06,h*.08);
  if(snow){ctx.fillStyle=snow;for(let i=0;i<tiers;i++){const ty=y-h+(i*h/tiers)*.95,bw=w*(0.35+i/tiers*.75);ctx.beginPath();ctx.moveTo(x,ty);ctx.lineTo(x+bw*.45,ty+h/tiers*.6);ctx.lineTo(x-bw*.45,ty+h/tiers*.6);ctx.closePath();ctx.fill()}}}
function palm(ctx,x,y,h,lean,col,rng){ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineCap='round';const tx=x+lean*h,ty=y-h;
  for(let k=0;k<3;k++){ctx.lineWidth=h*(0.05-k*0.012);ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(x+lean*h*.15,y-h*.55,tx,ty);ctx.stroke()}
  const n=9;for(let i=0;i<n;i++){const dir=(i/(n-1))*2-1, l=h*(0.34+rng()*.1), ex=tx+dir*l, ey=ty-l*.25+Math.abs(dir)*l*.75+ (1-Math.abs(dir))*-l*.35;
    const cx=tx+dir*l*.55, cy=ty-l*.45-(1-Math.abs(dir))*l*.2;const wdt=l*.09;
    ctx.beginPath();ctx.moveTo(tx,ty);ctx.quadraticCurveTo(cx,cy-wdt,ex,ey);ctx.quadraticCurveTo(cx,cy+wdt,tx,ty+4);ctx.fill();
    ctx.lineWidth=2;for(let j=1;j<12;j++){const t=j/12,px=(1-t)*(1-t)*tx+2*(1-t)*t*cx+t*t*ex,py=(1-t)*(1-t)*ty+2*(1-t)*t*cy+t*t*ey;ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px+dir*8-4,py+l*.12*(1-t*.5));ctx.stroke()}}
  ctx.beginPath();ctx.arc(tx,ty+6,h*.03,0,Math.PI*2);ctx.fill()}
function roundTree(ctx,x,y,h,col,rng){ctx.fillStyle=col;ctx.fillRect(x-h*.035,y-h*.5,h*.07,h*.5);
  for(let i=0;i<14;i++){const a=rng()*Math.PI*2,d=rng()*h*.3;ctx.beginPath();ctx.arc(x+Math.cos(a)*d*1.3,y-h*.68+Math.sin(a)*d*.8,h*(0.14+rng()*.1),0,Math.PI*2);ctx.fill()}
  ctx.lineWidth=h*.025;ctx.strokeStyle=col;[[-1,.45],[1,.5]].forEach(([s,t])=>{ctx.beginPath();ctx.moveTo(x,y-h*t);ctx.lineTo(x+s*h*.2,y-h*(t+.18));ctx.stroke()})}
function lotus(ctx,x,y,s,petal='#f29bb7',deep='#d4547e'){ctx.save();ctx.translate(x,y);
  [[-1.1,.8],[1.1,.8],[-.6,.95],[.6,.95],[0,1.05]].forEach(([a,l])=>{ctx.save();ctx.rotate(a*.55);const g=ctx.createLinearGradient(0,0,0,-s*l);g.addColorStop(0,deep);g.addColorStop(1,petal);ctx.fillStyle=g;
    ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(s*.42,-s*l*.55,0,-s*l);ctx.quadraticCurveTo(-s*.42,-s*l*.55,0,0);ctx.fill();ctx.restore()});ctx.restore()}
function lilyPad(ctx,x,y,r,col){ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(x,y,r,r*.32,0,0.15,Math.PI*2-0.15);ctx.lineTo(x,y);ctx.closePath();ctx.fill()}
function diya(ctx,x,y,s,rng){ctx.save();ctx.globalCompositeOperation='lighter';glow(ctx,x,y-s*.9,s*3.2,'#ffb347',.45);ctx.restore();
  const g=ctx.createLinearGradient(0,y-s*.3,0,y+s*.5);g.addColorStop(0,'#e0823c');g.addColorStop(1,'#7a2e14');ctx.fillStyle=g;
  ctx.beginPath();ctx.moveTo(x-s,y-s*.15);ctx.quadraticCurveTo(x,y+s*.75,x+s,y-s*.15);ctx.quadraticCurveTo(x+s*1.12,y-s*.3,x+s*.9,y-s*.28);ctx.lineTo(x-s*.9,y-s*.28);ctx.closePath();ctx.fill();
  ctx.fillStyle='#f5c26b';ctx.beginPath();ctx.ellipse(x,y-s*.22,s*.9,s*.12,0,0,Math.PI*2);ctx.fill();
  const f=ctx.createRadialGradient(x,y-s*.6,0,x,y-s*.7,s*.6);f.addColorStop(0,'#fffbe0');f.addColorStop(.5,'#ffd24a');f.addColorStop(1,'rgba(255,120,20,0)');
  ctx.fillStyle=f;ctx.beginPath();ctx.moveTo(x,y-s*1.25);ctx.quadraticCurveTo(x+s*.3,y-s*.55,x,y-s*.3);ctx.quadraticCurveTo(x-s*.3,y-s*.55,x,y-s*1.25);ctx.fill()}
function marigoldToran(ctx,rng,y,sag,cols=['#ff9f1c','#ffbf1f','#f26b1d']){const n=46;
  const pt=t=>[t*W,y+Math.sin(t*Math.PI)*sag];
  for(let i=0;i<=n;i++){const[x,yy]=pt(i/n);flower(ctx,x,yy,17,cols[i%cols.length],rng)}
  // hanging strands with mango leaves
  for(let k=1;k<8;k++){const t=k/8,[x,yy]=pt(t);const len=40+rng()*50;for(let j=1;j<5;j++)flower(ctx,x,yy+j*16,10,cols[(k+j)%cols.length],rng);leaf(ctx,x,yy+len+50,'#2f7d32')}}
function flower(ctx,x,y,r,col,rng){ctx.fillStyle=mix(col,'#7a2e00',.35);ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=col;for(let i=0;i<9;i++){const a=rng()*Math.PI*2,d=rng()*r*.55;ctx.beginPath();ctx.arc(x+Math.cos(a)*d,y+Math.sin(a)*d,r*.45,0,Math.PI*2);ctx.fill()}
  ctx.fillStyle=rgba('#ffffff',.25);ctx.beginPath();ctx.arc(x-r*.3,y-r*.3,r*.3,0,Math.PI*2);ctx.fill()}
function leaf(ctx,x,y,col,s=26,rot=0){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(0,-s);ctx.quadraticCurveTo(s*.5,0,0,s);ctx.quadraticCurveTo(-s*.5,0,0,-s);ctx.fill();ctx.strokeStyle=rgba('#ffffff',.25);ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(0,-s);ctx.lineTo(0,s);ctx.stroke();ctx.restore()}
function mangoToran(ctx,rng,y){ctx.strokeStyle='#6b4a1a';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
  for(let i=0;i<24;i++){const x=20+i*(W-40)/23;leaf(ctx,x,y+36,i%2?'#2e7d32':'#43a047',34,(rng()-.5)*.25);if(i%3===0)flower(ctx,x+22,y+6,12,'#ffb300',rng)}}
function mandala(ctx,x,y,R,col,a=.35){ctx.save();ctx.translate(x,y);ctx.strokeStyle=rgba(col,a);ctx.fillStyle=rgba(col,a*.35);
  [1,.78,.56,.36].forEach((k,ri)=>{const n=[32,24,16,12][ri];for(let i=0;i<n;i++){ctx.save();ctx.rotate(i/n*Math.PI*2);ctx.beginPath();ctx.moveTo(0,-R*k*.62);
    ctx.quadraticCurveTo(R*k*.12,-R*k*.82,0,-R*k);ctx.quadraticCurveTo(-R*k*.12,-R*k*.82,0,-R*k*.62);ctx.lineWidth=2;ctx.fill();ctx.stroke();ctx.restore()}
    ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(0,0,R*k*.6,0,Math.PI*2);ctx.stroke()});ctx.restore()}
function firework(ctx,rng,x,y,r,col){ctx.save();ctx.globalCompositeOperation='lighter';glow(ctx,x,y,r*.9,col,.25);const n=46;
  for(let i=0;i<n;i++){const a=i/n*Math.PI*2+rng()*.05,l=r*(0.7+rng()*.3);for(let k=0;k<7;k++){const t=(k+1)/7;ctx.fillStyle=rgba(k>4?'#ffffff':col,.9*(1-t*.5));
    ctx.beginPath();ctx.arc(x+Math.cos(a)*l*t,y+Math.sin(a)*l*t+t*t*r*.12,1.2+ (1-t)*1.8,0,Math.PI*2);ctx.fill()}}ctx.restore()}
function bokeh(ctx,rng,n,cols,y0=0,y1=H,rmax=40){ctx.save();ctx.globalCompositeOperation='lighter';for(let i=0;i<n;i++){const r=6+rng()*rmax;glow(ctx,rng()*W,lerp(y0,y1,rng()),r,cols[i%cols.length],.25+rng()*.3)}ctx.restore()}
function stringLights(ctx,rng,y,sag,cols){ctx.strokeStyle='rgba(40,20,10,.7)';ctx.lineWidth=2;ctx.beginPath();for(let x=0;x<=W;x+=10)ctx.lineTo(x,y+Math.sin(x/W*Math.PI)*sag);ctx.stroke();
  for(let i=0;i<30;i++){const x=18+i*(W-36)/29,yy=y+Math.sin(x/W*Math.PI)*sag+8,c=cols[i%cols.length];ctx.save();ctx.globalCompositeOperation='lighter';glow(ctx,x,yy,26,c,.55);ctx.restore();ctx.fillStyle=mix(c,'#ffffff',.5);ctx.beginPath();ctx.ellipse(x,yy,5,8,0,0,Math.PI*2);ctx.fill()}}
function kite(ctx,x,y,s,col,col2,rot,rng){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(0,-s);ctx.lineTo(s*.8,0);ctx.lineTo(0,s*1.1);ctx.lineTo(-s*.8,0);ctx.closePath();ctx.fill();
  ctx.fillStyle=col2;ctx.beginPath();ctx.moveTo(0,-s);ctx.lineTo(s*.8,0);ctx.lineTo(0,0);ctx.closePath();ctx.fill();ctx.strokeStyle=rgba('#3b2a1a',.6);ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(0,-s);ctx.lineTo(0,s*1.1);ctx.moveTo(-s*.8,0);ctx.lineTo(s*.8,0);ctx.stroke();
  ctx.fillStyle=col2;ctx.beginPath();ctx.moveTo(0,s*1.1);ctx.lineTo(s*.25,s*1.45);ctx.lineTo(-s*.25,s*1.45);ctx.closePath();ctx.fill();
  ctx.strokeStyle=rgba('#ffffff',.55);ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,s*1.1);ctx.bezierCurveTo(s*.4,s*3,-s*1.2,s*5,s*.6+rng()*s,s*9);ctx.stroke();ctx.restore()}
function lantern(ctx,x,y,s,col){ctx.strokeStyle=rgba('#e8c07a',.8);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,y-s*1.2);ctx.stroke();

/* ---------- selection ---------- */
const SWITCH_HOUR = 0;           // new card appears at 12:00 AM (midnight) local time
const SCENE_KEYS = Object.keys(SCENES);
const pad = n => String(n).padStart(2,'0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromKey = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y,m-1,d); };
const dayNum = k => Math.round(Date.UTC(...k.split('-').map((v,i)=>i===1?v-1:+v))/864e5);
function cardDayKey(now=new Date()){ return keyOf(new Date(now.getTime() - SWITCH_HOUR*3600e3)); }
function festivalOn(k){
  for(const f of FESTIVALS){ for(const d of f.dates){
    if(typeof d==='string' ? d===k : (k>=d[0] && k<=d[1])) return f; } }
  return null;
}
function pickFor(k, qShift=0, sShift=0){
  const n = dayNum(k), fest = festivalOn(k);
  const quote = fest && qShift===0 ? fest.wishes[n % fest.wishes.length]
              : QUOTES[((n*37 + qShift*11) % QUOTES.length + QUOTES.length) % QUOTES.length];
  // scenes rotate through a shuffled order each 10-day block so neighbours never repeat
  const sIdx = ((n*3 + sShift) % SCENE_KEYS.length + SCENE_KEYS.length) % SCENE_KEYS.length;
  const useFest = fest && sShift===0;
  return { fest, quote, scene: useFest ? null : SCENE_KEYS[sIdx], theme: useFest ? fest.theme : null,
           dawn: DAWNS[(n + Math.floor(n/10) + sShift) % DAWNS.length], seed: hashStr(k + ':' + sShift) };
}

/* ---------- text ---------- */
function wrap(ctx, text, maxW){
  const words = text.split(/\s+/), lines = []; let line = '';
  for(const w of words){ const t = line ? line+' '+w : w; if(ctx.measureText(t).width > maxW && line){ lines.push(line); line = w; } else line = t; }
  if(line) lines.push(line); return lines;
}
function drawText(ctx, pick, quoteText, layout){
  // legibility veils
  let g = ctx.createLinearGradient(0,0,0,380); g.addColorStop(0,'rgba(10,8,24,.45)'); g.addColorStop(1,'rgba(10,8,24,0)'); ctx.fillStyle=g; ctx.fillRect(0,0,W,380);
  g = ctx.createLinearGradient(0,860,0,H); g.addColorStop(0,'rgba(10,8,24,0)'); g.addColorStop(1,'rgba(10,8,24,.5)'); ctx.fillStyle=g; ctx.fillRect(0,860,W,220);
  const qy = layout.quoteY || 700;
  const rg = ctx.createRadialGradient(540,qy,40,540,qy,520); rg.addColorStop(0,'rgba(8,6,20,.42)'); rg.addColorStop(1,'rgba(8,6,20,0)');
  ctx.save(); ctx.translate(540,qy); ctx.scale(1,.42); ctx.translate(-540,-qy); ctx.fillStyle=rg; ctx.fillRect(0,qy-520,W,1040); ctx.restore();

  // Good Morning — static, gold
  ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  ctx.font = '700 128px "Playfair Display", Georgia, serif';
  const gold = ctx.createLinearGradient(0,110,0,230); gold.addColorStop(0,'#fff4cf'); gold.addColorStop(.45,'#f1cf86'); gold.addColorStop(1,'#c8903f');
  ctx.save(); ctx.shadowColor='rgba(0,0,0,.55)'; ctx.shadowBlur=24; ctx.shadowOffsetY=4; ctx.fillStyle=gold; ctx.fillText('Good Morning',540,215); ctx.restore();
  ctx.save(); ctx.shadowColor='rgba(255,210,140,.55)'; ctx.shadowBlur=30; ctx.fillStyle=gold; ctx.fillText('Good Morning',540,215); ctx.restore();

  // festival greeting
  if(pick.fest){
    ctx.font = 'italic 600 62px "Cormorant Garamond", Georgia, serif';
    ctx.save(); ctx.shadowColor='rgba(0,0,0,.6)'; ctx.shadowBlur=16; ctx.fillStyle='#fff3dc'; ctx.fillText('~ ' + pick.fest.greet + ' ~', 540, 300); ctx.restore();
  }

  // quote — auto-fit
  let size = 56, lines;
  for(;size>=34;size-=2){ ctx.font = `500 ${size}px "Cormorant Garamond", Georgia, serif`; lines = wrap(ctx, '“'+quoteText+'”', 780); if(lines.length <= 4) break; }
  const lh = size*1.22, top = qy - (lines.length-1)*lh/2 + size*.33;
  ctx.save(); ctx.shadowColor='rgba(0,0,0,.75)'; ctx.shadowBlur=14; ctx.shadowOffsetY=2; ctx.fillStyle='#ffffff';
  lines.forEach((l,i)=>ctx.fillText(l,540,top+i*lh)); ctx.restore();

  // signature — static, on a soft dark bed so it reads over busy scenes
  { const sg=ctx.createRadialGradient(540,985,10,540,985,260); sg.addColorStop(0,'rgba(8,6,20,.45)'); sg.addColorStop(1,'rgba(8,6,20,0)'); ctx.save(); ctx.translate(540,985); ctx.scale(1,.3); ctx.translate(-540,-985); ctx.fillStyle=sg; ctx.fillRect(0,985-260,W,520); ctx.restore(); }
  if(SIG_IMG.complete && SIG_IMG.naturalWidth){ const sw=330, sh=sw*SIG_IMG.naturalHeight/SIG_IMG.naturalWidth;
    ctx.save(); ctx.shadowColor='rgba(0,0,0,.6)'; ctx.shadowBlur=12; ctx.drawImage(SIG_IMG, 540-sw/2, 985-sh/2, sw, sh); ctx.restore(); }
}

/* ---------- render ---------- */
const SIG_IMG = new Image(); SIG_IMG.src = SIG_SRC;
const sigReady = new Promise(res => { if(SIG_IMG.complete) res(); SIG_IMG.onload = res; SIG_IMG.onerror = res; });
const fontsReady = (async()=>{ try{ await Promise.race([Promise.all([
  document.fonts.load('700 128px "Playfair Display"'), document.fonts.load('500 56px "Cormorant Garamond"'), document.fonts.load('italic 600 62px "Cormorant Garamond"')
]), new Promise(r=>setTimeout(r,4000))]); }catch(e){} })();

async function renderCard(k, opts={}){
  await Promise.all([fontsReady, sigReady]);
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  const pick = pickFor(k, opts.qShift||0, opts.sShift||0), rng = mulberry(pick.seed);
  ctx.save(); ctx.clearRect(0,0,W,H);
  const layout = (pick.theme ? FEST_SCENES[pick.theme](ctx,rng) : SCENES[pick.scene].draw(ctx,rng,pick.dawn)) || {};
  ctx.restore(); ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1;
  drawText(ctx, pick, opts.customQuote || pick.quote, layout);
  return { pick, dataURL: cv.toDataURL('image/jpeg', .92) };
}
window.renderCard = renderCard;

/* ---------- UI ---------- */
const $ = id => document.getElementById(id);
const state = { key: cardDayKey(), qShift:0, sShift:0, custom:'' };
const hashKey = (location.hash||'').slice(1); if(/^\d{4}-\d{2}-\d{2}$/.test(hashKey)) state.key = hashKey;
const fmt = (k,o) => fromKey(k).toLocaleDateString('en-IN', o||{weekday:'long', day:'numeric', month:'long', year:'numeric'});
let lastRender = null, renderSeq = 0;

async function refresh(){
  const seq = ++renderSeq; $('loading').hidden = false;
  const out = await renderCard(state.key, {qShift:state.qShift, sShift:state.sShift, customQuote:state.custom});
  if(seq !== renderSeq) return;
  lastRender = out; $('cardImg').src = out.dataURL; $('loading').hidden = true;
  const today = cardDayKey(), p = out.pick;
  $('dayLabel').textContent = state.key === today ? "Today's card · " + fmt(state.key,{weekday:'short',day:'numeric',month:'short'}) : fmt(state.key,{weekday:'short',day:'numeric',month:'short',year:'numeric'});
  $('todayRow').hidden = state.key === today;
  const st = $('status'); st.textContent = '';
  const chip = document.createElement('span'); chip.className = 'chip' + (p.theme ? ' fest' : '');
  chip.textContent = p.theme ? p.fest.name : (p.fest ? p.fest.name + ' · everyday look' : SCENES[p.scene].label); st.appendChild(chip);
  if(state.key === today){ const s=document.createElement('span'); s.className='note'; s.textContent='Next card at 12:00 AM'; st.appendChild(s); }
  else if(state.key > today){ const s=document.createElement('span'); s.className='note'; s.textContent='Preview of an upcoming day'; st.appendChild(s); }
  document.getElementById('quoteText').value = state.custom || p.quote;
  window.cardReady = true;
}
function go(delta){ const d = fromKey(state.key); d.setDate(d.getDate()+delta); state.key = keyOf(d); state.qShift = state.sShift = 0; state.custom=''; refresh(); }
function toast(msg){ $('toast').textContent = msg; clearTimeout(toast.t); toast.t = setTimeout(()=>$('toast').textContent='', 5000); }

$('prevDay').onclick = () => go(-1);
$('nextDay').onclick = () => go(1);
$('goToday').onclick = () => { state.key = cardDayKey(); state.qShift=state.sShift=0; state.custom=''; refresh(); };
$('newQuote').onclick = () => { state.qShift++; state.custom=''; refresh(); };
$('newScene').onclick = () => { state.sShift++; refresh(); };
$('editQuote').onclick = () => { $('editor').hidden = !$('editor').hidden; if(!$('editor').hidden) $('quoteText').focus(); };
$('applyQuote').onclick = () => { const t = $('quoteText').value.trim().replace(/^["“]|["”]$/g,''); state.custom = t; refresh(); };
$('resetQuote').onclick = () => { state.custom=''; state.qShift=0; refresh(); };

function cardFile(){
  const b64 = lastRender.dataURL.split(',')[1], bin = atob(b64), bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new File([bytes], `good-morning-${state.key}.jpg`, {type:'image/jpeg'});
}
function downloadCard(){
  const a = document.createElement('a'); a.href = lastRender.dataURL; a.download = `good-morning-${state.key}.jpg`;
  document.body.appendChild(a); a.click(); a.remove();
}
const canShareFiles = (()=>{ try{ return !!(navigator.canShare && navigator.canShare({files:[new File([new Uint8Array(1)],'t.jpg',{type:'image/jpeg'})]})); }catch(e){ return false; } })();
if(!canShareFiles){
  $('saveBtn').textContent = 'Download card'; $('dlBtn').hidden = true;
  $('howto').innerHTML = 'This browser can\u2019t share images directly. Tap <b>Download card</b>, then send it from WhatsApp. For one-tap sharing open this app in <b>Chrome</b> (Android) or <b>Safari</b> (iPhone).';
}
$('saveBtn').onclick = async () => {
  if(!lastRender) return;
  if(!canShareFiles){ downloadCard(); toast('Downloaded. Open WhatsApp and attach it from your gallery.'); return; }
  try{
    await navigator.share({ files: [cardFile()] });
  }catch(e){
    if(e && e.name === 'AbortError') return;          // user closed the share sheet
    downloadCard(); toast('Sharing didn\u2019t open, so the card was downloaded instead.');
  }
};
$('dlBtn').onclick = () => { if(lastRender){ downloadCard(); toast('Downloaded to your phone.'); } };

// upcoming festivals
(function(){
  const today = cardDayKey(), items = [];
  for(const f of FESTIVALS) for(const d of f.dates){ const s = typeof d==='string'? d : d[0]; const e = typeof d==='string'? d : d[1]; if(e >= today) items.push({f, s}); }
  items.sort((a,b)=>a.s<b.s?-1:1);
  const ul = $('fests');
  items.slice(0,8).forEach(({f,s})=>{ const li=document.createElement('li'), b=document.createElement('button');
    const days = dayNum(s) - dayNum(today);
    b.innerHTML = `<span class="d"></span><span class="n"></span><span class="a"></span>`;
    b.querySelector('.d').textContent = fmt(s,{day:'numeric',month:'short'}); b.querySelector('.n').textContent = f.name;
    b.querySelector('.a').textContent = days<=0 ? 'today' : days===1 ? 'tomorrow' : `in ${days} days`;
    b.onclick = () => { state.key = s < today ? today : s; state.qShift=state.sShift=0; state.custom=''; refresh(); window.scrollTo({top:0,behavior:'smooth'}); };
    li.appendChild(b); ul.appendChild(li); });
})();

refresh();

// switch to the new day's card on its own at midnight, even if the page is left open
let shownToday = cardDayKey();
function rollover(){ const t = cardDayKey(); if(t !== shownToday){ const wasOnToday = state.key === shownToday; shownToday = t;
  if(wasOnToday){ state.key = t; state.qShift = state.sShift = 0; state.custom = ''; } refresh(); } }
setInterval(rollover, 30000);
document.addEventListener('visibilitychange', () => { if(!document.hidden) rollover(); });

if('serviceWorker' in navigator){ window.addEventListener('load', ()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
